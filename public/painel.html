<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle Caixa Pedro — Painel</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div style="max-width: 720px; margin: 0 auto; padding: 20px 16px 60px;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 style="font-size: 20px; margin: 0;">Controle Caixa Pedro</h1>
      <button id="btn-sair" style="border: none; background: transparent; color: #8A8272; font-size: 13px;">Sair</button>
    </div>

    <!-- Resumo do dia -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
      <div class="cartao">
        <div style="font-size: 11px; color: #8A8272; text-transform: uppercase;">Entradas</div>
        <div id="resumo-entradas" class="entrada-cor" style="font-size: 18px; font-weight: 700; margin-top: 4px;">R$ 0,00</div>
      </div>
      <div class="cartao">
        <div style="font-size: 11px; color: #8A8272; text-transform: uppercase;">Saídas</div>
        <div id="resumo-saidas" class="saida-cor" style="font-size: 18px; font-weight: 700; margin-top: 4px;">R$ 0,00</div>
      </div>
      <div class="cartao" style="background: #221F17;">
        <div style="font-size: 11px; color: #C9C2B2; text-transform: uppercase;">Saldo</div>
        <div id="resumo-saldo" style="font-size: 18px; font-weight: 700; margin-top: 4px; color: #FFFFFF;">R$ 0,00</div>
      </div>
    </div>

    <!-- Formulário de lançamento -->
    <form id="form-lancamento" class="cartao" style="margin-bottom: 24px;">
      <div style="display: flex; background: #EAE4D6; border-radius: 12px; padding: 4px; margin-bottom: 16px;">
        <button type="button" data-tipo="entrada" class="botao-tipo" style="flex: 1; border: none; padding: 10px 0; border-radius: 8px; font-weight: 600;">Entrada</button>
        <button type="button" data-tipo="saida" class="botao-tipo" style="flex: 1; border: none; padding: 10px 0; border-radius: 8px; font-weight: 600; background: transparent;">Saída</button>
      </div>
      <input type="hidden" id="tipo" value="entrada">

      <div class="campo">
        <label for="valor">Valor (R$)</label>
        <input id="valor" type="number" step="0.01" min="0.01" placeholder="0,00" required>
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" placeholder="Ex: caixa de som JBL" required>
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <select id="categoria">
          <option>Venda</option>
          <option>Serviço</option>
          <option>Conta</option>
          <option>Aluguel</option>
          <option>Outros</option>
        </select>
      </div>

      <button type="submit" class="btn-primario" style="width: 100%;">Salvar lançamento</button>
      <div id="mensagem-erro" class="erro"></div>
    </form>

    <!-- Fechamento do mês -->
    <div class="cartao" style="margin-bottom: 24px;">
      <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Fechamento do mês</div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px;">
        <span style="color: #8A8272;">Entradas</span>
        <span id="mes-entradas" class="entrada-cor" style="font-weight: 600;">R$ 0,00</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px;">
        <span style="color: #8A8272;">Saídas</span>
        <span id="mes-saidas" class="saida-cor" style="font-weight: 600;">R$ 0,00</span>
      </div>
      <div style="height: 1px; background: #EAE4D6; margin: 8px 0;"></div>
      <div style="display: flex; justify-content: space-between; font-size: 15px;">
        <span style="font-weight: 700;">Saldo do mês</span>
        <span id="mes-saldo" style="font-weight: 700;">R$ 0,00</span>
      </div>
    </div>

    <!-- Trocar senha -->
    <div class="cartao" style="margin-bottom: 24px;">
      <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Trocar senha</div>
      <form id="form-senha">
        <div class="campo">
          <label for="senha-atual">Senha atual</label>
          <input id="senha-atual" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="campo">
          <label for="senha-nova">Nova senha</label>
          <input id="senha-nova" type="password" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <button type="submit" class="btn-primario" style="width: 100%;">Salvar nova senha</button>
        <div id="mensagem-senha" class="erro"></div>
      </form>
    </div>

    <!-- Lista de hoje -->
    <div class="cartao">
      <div style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Lançamentos de hoje</div>
      <div id="lista-lancamentos"></div>
    </div>

  </div>

  <script src="/js/painel.js"></script>
</body>
</html>
